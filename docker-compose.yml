services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ohmcharge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ohmcharge']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ohmcharge-postgres:/var/lib/postgresql/data

volumes:
  ohmcharge-postgres:
